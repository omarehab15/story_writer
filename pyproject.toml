[project]
name = "story-service-m5"
version = "0.1.0"
description = "Interactive Lesson Stories: Module 5 (S5 Cast and Setting) with a multi-provider LLM layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pandas>=3.1.0",
]

[project.scripts]
run-s5 = "story_service.cli:run_s5"
llm-check = "story_service.cli:llm_check"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_service"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
